<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Pedro Augusto Xavier" />
    <link rel="canonical" href="{{url}}" />
    <link rel="alternate" hreflang="pt-BR" href="{{site}}/" />
    <link rel="alternate" hreflang="en" href="{{site}}/en/" />
    <link rel="alternate" hreflang="x-default" href="{{site}}/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pedro Xavier" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:locale:alternate" content="{{ogLocaleAlt}}" />
    <meta property="og:image" content="{{site}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ogAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0b1014" />
    <meta name="color-scheme" content="dark light" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pedro Augusto Xavier",
        "jobTitle": "{{jobTitle}}",
        "description": "{{description}}",
        "url": "{{url}}",
        "image": "{{site}}/og.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Nova Friburgo",
          "addressRegion": "RJ",
          "addressCountry": "BR"
        },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "CEFET/RJ" },
        "knowsLanguage": ["pt-BR", "en"],
        "knowsAbout": ["Python", "TypeScript", "React", "FastAPI", "Fastify", "PostgreSQL", "PHP"],
        "sameAs": [
          "https://github.com/pedro-augusto-xavier",
          "https://www.linkedin.com/in/pedro-augusto-xavier-machado-bb1133345"
        ]
      }
    </script>

    <script>
      ;(function () {
        var root = document.documentElement
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches
        root.dataset.theme = dark ? 'dark' : 'light'
        if (!dark) document.querySelector('meta[name="theme-color"]').content = '#f4f8f6'
        root.classList.add('js')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
